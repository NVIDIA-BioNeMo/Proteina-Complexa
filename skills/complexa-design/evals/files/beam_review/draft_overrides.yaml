# Synthetic proposed overrides, to be merged into search_binder_local_pipeline.
generation:
  task_name: 02_PDL1
  args:
    nsteps: 180
  dataloader:
    batch_size: 2
    dataset:
      nres:
        nsamples: 3
      nrepeat_per_sample: 2
  search:
    algorithm: best-of-n
    max_batch_size: 2
    step_checkpoints: [0, 100, 200, 300, 400]
    reward_threshold: null
